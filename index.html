<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Daydeck 앱의 개인정보처리방침과 이용약관">
<title>Daydeck 약관 및 정책</title>
<style>
  :root {
    --bg: #F2F3F8;
    --surface: #FFFFFF;
    --border: rgba(24,24,42,0.08);
    --text: #18182A;
    --text2: #55556E;
    --text3: #8B8BA6;
    --purple: #6B63F6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121220;
      --surface: #1B1B2E;
      --border: rgba(255,255,255,0.09);
      --text: #F0F0F8;
      --text2: #B4B4CC;
      --text3: #7C7C98;
      --purple: #9C95FF;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--purple); margin-bottom: 20px;
  }
  h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--text3); margin: 0 0 28px; font-size: 0.95rem; }
  a.card {
    display: block; padding: 18px 20px; margin-bottom: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; text-decoration: none; color: inherit;
  }
  a.card:hover { border-color: var(--purple); }
  .card-title { font-weight: 600; margin-bottom: 2px; }
  .card-desc { color: var(--text2); font-size: 0.9rem; }
  footer { margin-top: 32px; color: var(--text3); font-size: 0.85rem; }
  footer a { color: var(--purple); }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"></div>
  <h1>Daydeck</h1>
  <p class="sub">약관 및 정책</p>

  <a class="card" href="privacy_policy.html">
    <div class="card-title">개인정보처리방침</div>
    <div class="card-desc">어떤 정보를 수집하고 어떻게 다루는지 안내합니다.</div>
  </a>

  <a class="card" href="terms_of_service.html">
    <div class="card-title">이용약관</div>
    <div class="card-desc">서비스 이용 조건과 구독 관련 사항을 안내합니다.</div>
  </a>

  <footer>
    문의: <a href="mailto:junnuu9@gmail.com">junnuu9@gmail.com</a>
  </footer>
</div>
</body>
</html>
